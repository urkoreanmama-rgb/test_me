<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>QR 코드 — 유학생 아르바이트 체커</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc;--card:#ffffff;--border:#e2e8f0;
  --accent:#4f46e5;--accent2:#6366f1;--text:#1e293b;--sub:#475569;--muted:#94a3b8;
}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 32px;max-width:480px;width:100%;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.badge{display:inline-flex;align-items:center;gap:6px;background:#ede9fe;border:1px solid #c4b5fd;border-radius:20px;padding:5px 14px;font-size:0.78rem;color:#4f46e5;margin-bottom:16px;font-weight:600}
h1{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:var(--text)}
.sub{color:var(--sub);font-size:0.88rem;margin-bottom:28px;line-height:1.5}
#qr-canvas{border-radius:12px;background:#fff;border:2px solid var(--border);padding:16px;margin:0 auto 24px}
.url-box{background:#f1f5f9;border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:0.8rem;color:var(--sub);word-break:break-all;margin-bottom:24px}
.langs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:28px;font-size:0.82rem;color:var(--sub)}
.langs span{background:#f1f5f9;border:1px solid var(--border);border-radius:16px;padding:4px 12px;color:var(--sub)}
.btn-print{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:13px 28px;font-size:0.95rem;font-weight:600;cursor:pointer;margin-bottom:14px;width:100%;justify-content:center}
.btn-back{display:inline-block;color:var(--sub);font-size:0.85rem;text-decoration:none;margin-top:4px}
.btn-back:hover{color:var(--accent2)}
.print-note{font-size:0.78rem;color:var(--muted);margin-top:16px;line-height:1.6}

@media print {
  body{background:#fff;padding:0;display:block}
  .card{border:none;box-shadow:none;max-width:100%;padding:20px}
  .badge{border:1px solid #c4b5fd;color:#4f46e5;background:#ede9fe}
  h1{color:#1e293b}
  .sub{color:#475569}
  #qr-canvas{margin:16px auto;border:1px solid #e2e8f0}
  .url-box{color:#475569;border-color:#e2e8f0;background:#f8fafc}
  .langs span{border-color:#e2e8f0;color:#475569;background:#f8fafc}
  .btn-print,.btn-back,.print-note{display:none}
}
</style>
</head>
<body>

<div class="card">
  <div class="badge">🇰🇷 유학생 아르바이트 체커</div>
  <h1>나도 알바할 수 있을까? 🤔</h1>
  <p class="sub">
    아래 QR 코드를 스캔하면<br>
    8가지 질문으로 즉시 확인할 수 있어요<br>
    <span style="font-size:0.8rem;color:var(--muted)">Scan to check part-time work eligibility</span>
  </p>

  <canvas id="qr-canvas"></canvas>

  <div class="url-box" id="url-display"></div>

  <div class="langs">
    <span>🇰🇷 한국어</span>
    <span>🇺🇸 English</span>
    <span>🇺🇿 O'zbek</span>
    <span>🇨🇳 中文</span>
    <span>🇷🇺 Русский</span>
    <span>🇳🇵 नेपाली</span>
  </div>

  <button class="btn-print" onclick="window.print()">🖨️ 인쇄 / Print</button>
  <br>
  <a class="btn-back" href="index.html">← 체커로 돌아가기</a>

  <p class="print-note">
    ※ 인쇄 후 게시판, 기숙사, 학생처 등에 부착하세요<br>
    ※ Post this on bulletin boards, dorms, or student affairs offices
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const TARGET_URL = 'https://test-me-ecru.vercel.app/유학생-아르바이트-체커/index.html';
document.getElementById('url-display').textContent = TARGET_URL;

QRCode.toCanvas(document.getElementById('qr-canvas'), TARGET_URL, {
  width: 240,
  margin: 2,
  color: { dark: '#000000', light: '#ffffff' },
}, function(err) {
  if (err) {
    document.getElementById('qr-canvas').insertAdjacentHTML('afterend',
      '<p style="color:#ef4444;font-size:0.85rem">QR 코드 생성 실패. 인터넷 연결을 확인하세요.</p>');
  }
});
</script>
</body>
</html>
