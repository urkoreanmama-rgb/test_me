<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="rgba(99,102,241,0.07)"/>
  <circle cx="1100" cy="500" r="120" fill="rgba(99,102,241,0.05)"/>

  <!-- Left accent bar -->
  <rect x="80" y="155" width="7" height="110" rx="4" fill="url(#acc)"/>

  <!-- Main title KO -->
  <text x="112" y="218" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="58" font-weight="800" fill="white">나도 알바할 수 있을까? 🤔</text>

  <!-- Subtitle EN -->
  <text x="112" y="268" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#94a3b8">Can I Work Part-Time in Korea?</text>

  <!-- Divider -->
  <line x1="112" y1="295" x2="700" y2="295" stroke="#334155" stroke-width="1.5"/>

  <!-- Description line -->
  <text x="112" y="340" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="24" fill="#64748b">8가지 질문으로 즉시 확인 · 8-step instant eligibility check</text>

  <!-- Language flags row -->
  <text x="112" y="400" font-size="42">🇰🇷</text>
  <text x="170" y="400" font-size="42">🇺🇸</text>
  <text x="228" y="400" font-size="42">🇺🇿</text>
  <text x="286" y="400" font-size="42">🇨🇳</text>
  <text x="344" y="400" font-size="42">🇷🇺</text>
  <text x="402" y="400" font-size="42">🇳🇵</text>

  <!-- Language labels -->
  <text x="113" y="430" font-family="sans-serif" font-size="15" fill="#475569">한국어</text>
  <text x="169" y="430" font-family="sans-serif" font-size="15" fill="#475569">English</text>
  <text x="224" y="430" font-family="sans-serif" font-size="15" fill="#475569">O'zbek</text>
  <text x="283" y="430" font-family="sans-serif" font-size="15" fill="#475569">中文</text>
  <text x="340" y="430" font-family="sans-serif" font-size="15" fill="#475569">Русский</text>
  <text x="396" y="430" font-family="sans-serif" font-size="15" fill="#475569">नेपाली</text>

  <!-- Badge pill -->
  <rect x="112" y="460" width="420" height="48" rx="24" fill="rgba(99,102,241,0.18)" stroke="#6366f1" stroke-width="1.5"/>
  <text x="322" y="490" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" fill="#818cf8" text-anchor="middle">🇰🇷 법무부 출입국 공식 기준</text>

  <!-- Green checkmark card mockup (right side) -->
  <rect x="760" y="140" width="360" height="340" rx="18" fill="rgba(30,41,59,0.9)" stroke="#334155" stroke-width="1.5"/>
  <rect x="760" y="140" width="360" height="6" rx="3" fill="url(#acc)"/>

  <text x="940" y="230" font-family="sans-serif" font-size="52" text-anchor="middle">✅</text>
  <text x="940" y="280" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">아르바이트 가능!</text>
  <text x="940" y="308" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">You Can Work Part-Time!</text>

  <!-- Mini info pills -->
  <rect x="800" y="330" width="140" height="36" rx="8" fill="rgba(99,102,241,0.15)" stroke="#475569" stroke-width="1"/>
  <text x="870" y="353" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">D-2 학사과정</text>

  <rect x="955" y="330" width="140" height="36" rx="8" fill="rgba(16,185,129,0.15)" stroke="#475569" stroke-width="1"/>
  <text x="1025" y="353" font-family="sans-serif" font-size="13" fill="#34d399" text-anchor="middle">주 최대 30시간</text>

  <rect x="800" y="378" width="295" height="36" rx="8" fill="rgba(99,102,241,0.15)" stroke="#475569" stroke-width="1"/>
  <text x="947" y="401" font-family="sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">TOPIK 4급 · 학기 중</text>

  <!-- URL watermark -->
  <text x="1170" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#334155" text-anchor="end">test-me-ecru.vercel.app</text>
</svg>
