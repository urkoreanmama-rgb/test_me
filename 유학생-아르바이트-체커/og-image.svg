<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="150" cy="550" r="180" fill="white" fill-opacity="0.05"/>
  <circle cx="1100" cy="520" r="120" fill="white" fill-opacity="0.04"/>

  <!-- Card background -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="url(#card-grad)" stroke="white" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="100" y="110" width="340" height="48" rx="24" fill="white" fill-opacity="0.2"/>
  <text x="120" y="142" font-family="Arial, sans-serif" font-size="26" fill="white">🇰🇷</text>
  <text x="158" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white" fill-opacity="0.95">D-2 / D-4 유학생 전용</text>

  <!-- Main title line 1 -->
  <text x="100" y="255" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">나도 한국에서</text>

  <!-- Main title line 2 -->
  <text x="100" y="345" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="white" letter-spacing="-2">알바해도 될까? 🤔</text>

  <!-- Divider -->
  <line x1="100" y1="375" x2="520" y2="375" stroke="white" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtitle -->
  <text x="100" y="418" font-family="Arial, sans-serif" font-size="30" fill="white" fill-opacity="0.85">8가지 질문으로 허가 가능성 즉시 확인</text>

  <!-- Footer note -->
  <text x="100" y="520" font-family="Arial, sans-serif" font-size="20" fill="white" fill-opacity="0.55">법무부·하이코리아 기준 참고 · 최종 확인은 학교 국제처·출입국관서</text>

  <!-- Right side decoration: check marks -->
  <rect x="820" y="180" width="280" height="60" rx="14" fill="white" fill-opacity="0.12"/>
  <text x="845" y="218" font-family="Arial, sans-serif" font-size="24" fill="white">✅ 비자 종류 확인</text>

  <rect x="820" y="258" width="280" height="60" rx="14" fill="white" fill-opacity="0.12"/>
  <text x="845" y="296" font-family="Arial, sans-serif" font-size="24" fill="white">✅ 근무 가능 시간</text>

  <rect x="820" y="336" width="280" height="60" rx="14" fill="white" fill-opacity="0.12"/>
  <text x="845" y="374" font-family="Arial, sans-serif" font-size="24" fill="white">✅ 즉시 결과 확인</text>

  <rect x="820" y="414" width="280" height="60" rx="14" fill="white" fill-opacity="0.12"/>
  <text x="845" y="452" font-family="Arial, sans-serif" font-size="24" fill="white">✅ 완전 무료</text>
</svg>
